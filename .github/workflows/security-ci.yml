name: Legacy Python Security CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**/*.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/run_bandit.sh"
      - "scripts/run_pip_audit.sh"
      - "scripts/run_trivy.sh"

  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**/*.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/run_bandit.sh"
      - "scripts/run_pip_audit.sh"
      - "scripts/run_trivy.sh"

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Legacy Python Test and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest -v

      - name: Run Bandit security scan
        run: ./scripts/run_bandit.sh

      - name: Run dependency vulnerability scan
        run: ./scripts/run_pip_audit.sh

      - name: Run container vulnerability scan
        run: ./scripts/run_trivy.sh
