name: Endpoint Security Engine CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/SecurityAutomation.Core.Tests/**"
      - "SecurityAutomationPipeline.slnx"
      - ".github/workflows/dotnet-ci.yml"

  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/SecurityAutomation.Core.Tests/**"
      - "SecurityAutomationPipeline.slnx"
      - ".github/workflows/dotnet-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SecurityAutomationPipeline.slnx

      - name: Build
        run: dotnet build SecurityAutomationPipeline.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test SecurityAutomationPipeline.slnx --no-build --configuration Release
